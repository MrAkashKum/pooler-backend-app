server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}

# MySQL datasource. In GCP, DB_URL can contain the Cloud SQL connector URL.
# For a normal MySQL server, set DB_HOST, DB_PORT, DB_NAME, DB_USER and DB_PASS.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pooler}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=${DB_USE_SSL:true}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USER:pooler_app}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD_MS:20000}

spring.h2.console.enabled=false
# Production must not auto-create or auto-alter tables. Use migrations, then validate the schema.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.transaction.default-timeout=${TRANSACTION_DEFAULT_TIMEOUT_SECONDS:30}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

# App security
app.jwt.secret=${JWT_SECRET}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:https://hoppo.io}
app.email-verification.token-expiry-minutes=${EMAIL_VERIFICATION_TOKEN_EXPIRY_MINUTES:60}
app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}
app.security.cors.allowed-origins=${CORS_ORIGINS:https://hoppo.io}

# Bounded in-memory guards. For multi-instance production, mirror these limits at gateway/WAF/Redis.
rate-limit.max-entries=${RATE_LIMIT_MAX_ENTRIES:20000}
rate-limit.cleanup-interval-seconds=${RATE_LIMIT_CLEANUP_INTERVAL_SECONDS:60}
file-upload.max-tracked-files=${FILE_UPLOAD_MAX_TRACKED_FILES:2000}

# Async executors
app.async.defaults.core-pool-size=${ASYNC_DEFAULT_CORE_POOL_SIZE:8}
app.async.defaults.max-pool-size=${ASYNC_DEFAULT_MAX_POOL_SIZE:16}
app.async.defaults.queue-capacity=${ASYNC_DEFAULT_QUEUE_CAPACITY:200}
app.async.defaults.keep-alive-seconds=${ASYNC_DEFAULT_KEEP_ALIVE_SECONDS:60}
app.async.mail.core-pool-size=${ASYNC_MAIL_CORE_POOL_SIZE:2}
app.async.mail.max-pool-size=${ASYNC_MAIL_MAX_POOL_SIZE:6}
app.async.mail.queue-capacity=${ASYNC_MAIL_QUEUE_CAPACITY:200}
app.async.audit.core-pool-size=${ASYNC_AUDIT_CORE_POOL_SIZE:2}
app.async.audit.max-pool-size=${ASYNC_AUDIT_MAX_POOL_SIZE:6}
app.async.audit.queue-capacity=${ASYNC_AUDIT_QUEUE_CAPACITY:500}
app.async.notification.core-pool-size=${ASYNC_NOTIFICATION_CORE_POOL_SIZE:2}
app.async.notification.max-pool-size=${ASYNC_NOTIFICATION_MAX_POOL_SIZE:8}
app.async.notification.queue-capacity=${ASYNC_NOTIFICATION_QUEUE_CAPACITY:500}
app.async.shutdown-await-seconds=${ASYNC_SHUTDOWN_AWAIT_SECONDS:30}
chat.cleanup-batch-size=${CHAT_CLEANUP_BATCH_SIZE:250}
scheduling.thread-pool-size=${SCHEDULING_THREAD_POOL_SIZE:4}
scheduling.shutdown-await-seconds=${SCHEDULING_SHUTDOWN_AWAIT_SECONDS:30}

# Logging privacy and 30-day archive retention
logging.level.root=WARN
logging.level.com.akash.pooler_backend=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
app.logging.path=${LOG_PATH:./logs}
app.logging.level=${APP_LOG_LEVEL:INFO}
app.logging.archive.max-file-size=${LOG_ARCHIVE_MAX_FILE_SIZE:100MB}
app.logging.archive.max-history-hours=${LOG_ARCHIVE_MAX_HISTORY_HOURS:720}
app.logging.archive.total-size-cap=${LOG_ARCHIVE_TOTAL_SIZE_CAP:3GB}

# Profile photos use a public GCS bucket; payment QR images use a separate private bucket.
profile-media.bucket=${PROFILE_MEDIA_BUCKET}
profile-media.private-bucket=${PROFILE_MEDIA_PRIVATE_BUCKET}
profile-media.key-prefix=${PROFILE_MEDIA_KEY_PREFIX:hoppo/profile-media/prod}
profile-media.public-base-url=${PROFILE_MEDIA_PUBLIC_BASE_URL}
profile-media.max-size-mb=${PROFILE_MEDIA_MAX_SIZE_MB:5}
profile-media.private-url-expiry-minutes=${PROFILE_MEDIA_PRIVATE_URL_EXPIRY_MINUTES:5}
