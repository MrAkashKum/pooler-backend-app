<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f7fa;margin:0;padding:40px 20px}
        .card{background:#fff;border-radius:12px;max-width:520px;margin:auto;padding:40px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
        .logo{font-size:22px;font-weight:700;color:#4f46e5;margin-bottom:24px}
        h1{font-size:24px;color:#1a1a2e;margin:0 0 12px}
        p{color:#555;line-height:1.6;margin:0 0 16px}
        .btn{display:inline-block;background:#4338ca;color:#fff!important;padding:14px 32px;border-radius:8px;text-decoration:none!important;font-weight:700;font-size:15px;line-height:20px}
        .footer{margin-top:32px;font-size:12px;color:#999;text-align:center}
        .feature{margin:8px 0;font-size:14px;color:#444}
        @media only screen and (max-width:600px){body{padding:16px 8px!important}.card{padding:24px 20px!important}.btn{display:block!important;text-align:center!important}}
    </style>
</head>
<body>
<div class="card">
    <div class="logo" th:text="${appName}">Hoppo</div>
    <h1>Welcome aboard, <span th:text="${userName}">User</span>! 🎉</h1>
    <p>Your account has been created successfully. You're now part of our platform.</p>
    <div class="feature">✅ Secure JWT-based authentication</div>
    <div class="feature">✅ Multi-device session management</div>
    <div class="feature">✅ Role-based access control</div>
    <br>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin:8px 0 24px">
        <tr>
            <td bgcolor="#4338ca" style="border-radius:8px;text-align:center">
                <a class="btn" th:href="${loginLink}"
                   style="display:inline-block;background-color:#4338ca;color:#ffffff!important;padding:14px 32px;border-radius:8px;text-decoration:none!important;font-weight:700;font-size:15px;line-height:20px">Get started</a>
            </td>
        </tr>
    </table>
    <div class="footer">
        &copy; <span th:text="${appName}">Pooler</span>
    </div>
</div>
</body>
</html>
